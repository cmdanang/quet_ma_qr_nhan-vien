<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co.opmart Đà Nẵng - Quản Lý Nhân Sự</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --blue: #005691; --red: #ed1c24; --green: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        /* Header */
        header { background: #fff; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--red); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-box { display: flex; align-items: center; gap: 15px; }
        #logo-img { height: 55px; border: 1px solid #ddd; padding: 4px; border-radius: 8px; cursor: pointer; }
        .title h1 { color: var(--blue); margin: 0; font-size: 20px; text-transform: uppercase; }
        .title p { margin: 0; color: var(--red); font-weight: bold; font-size: 13px; }

        /* Dashboard */
        .main { display: grid; grid-template-columns: 380px 1fr; gap: 25px; padding: 25px 5%; max-width: 1500px; margin: auto; }
        
        /* Scanner Section */
        .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #eee; background: #000; min-height: 300px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-red { background: var(--red); color: #fff; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Stats & List */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-item { background: var(--blue); color: #fff; padding: 18px; border-radius: 15px; display: flex; align-items: center; gap: 15px; }
        .stat-item.red { background: var(--red); }
        .stat-item i { font-size: 30px; opacity: 0.7; }
        .stat-num { font-size: 28px; font-weight: 800; }

        .table-card { background: #fff; border-radius: 20px; padding: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--blue); border-bottom: 2px solid #eee; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }
        
        .badge { padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .badge-in { background: #e8f5e9; color: var(--green); }
        .badge-out { background: #ffebee; color: var(--red); }

        /* Chế độ chờ */
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 12px; }
        #toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 30px; border-radius: 10px; color: #fff; font-weight: bold; z-index: 1000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: fadeInUp 0.3s; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #hidden-input { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <input type="file" id="change-logo" hidden accept="image/*">
        <img src="https://media.loveitopcdn.com/3807/logo-coopmart-compressed.jpg" id="logo-img" title="Nhấn để đổi Logo">
        <div class="title">
            <h1>Co.opmart Đà Nẵng</h1>
            <p>Hệ Thống Kiểm Soát Nhân Sự 2026</p>
        </div>
    </div>
    <div id="clock" style="font-weight: 800; color: var(--blue);"></div>
</header>

<div class="main">
    <div class="left">
        <div class="card">
            <h3 style="margin-top:0; color: var(--blue);"><i class="fa-solid fa-qrcode"></i> TRẠM QUÉT MÃ</h3>
            <div style="position: relative;">
                <div id="reader"></div>
                <div id="loading">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 40px; color: var(--blue);"></i>
                    <p style="font-weight: bold; margin-top: 10px; color: var(--blue);">Đang xử lý (3s)...</p>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-blue" onclick="startCamera('environment')"><i class="fa-solid fa-camera"></i> CAM SAU</button>
                <button class="btn btn-blue" onclick="startCamera('user')"><i class="fa-solid fa-id-badge"></i> CAM TRƯỚC</button>
                <button class="btn btn-red" style="grid-column: span 2;" onclick="stopCamera()"><i class="fa-solid fa-stop"></i> DỪNG CAMERA</button>
            </div>
            <p style="font-size: 11px; color: #999; margin-top: 15px;">Hỗ trợ súng quét mã USB - Tự động Focus</p>
        </div>
    </div>

    <div class="right">
        <div class="stats">
            <div class="stat-item">
                <i class="fa-solid fa-users-viewfinder"></i>
                <div>
                    <span class="stat-num" id="active-num">0</span><br>
                    <span style="font-size: 12px; font-weight: bold;">ĐANG TRONG CA</span>
                </div>
            </div>
            <div class="stat-item red">
                <i class="fa-solid fa-calendar-check"></i>
                <div>
                    <span class="stat-num" id="today-txt">--/--</span><br>
                    <span style="font-size: 12px; font-weight: bold;">NGÀY HIỆN TẠI</span>
                </div>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Nhân Viên</th>
                        <th>Bộ Phận</th>
                        <th>Vào Ca</th>
                        <th>Ra Ca</th>
                        <th style="text-align: center;">Phút</th>
                    </tr>
                </thead>
                <tbody id="log-table">
                    <tr><td colspan="5" style="text-align:center; padding:50px; color:#999;">Đang tải dữ liệu ngày mới...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<input type="text" id="hidden-input" autofocus>
<div id="toast"></div>

<script>
    // --- CHÚ Ý: DÁN URL APPS SCRIPT VÀO ĐÂY ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwF3MiGBVWlvAprhv3NDi9Rn0gZJyFZ-ycfB5h2oNMf9h69MqsjnxSUXz9L1nV72UtbQg/exec";
    
    let html5QrCode;
    let isProcessing = false;
    let currentDay = new Date().toLocaleDateString('vi-VN');
    const hInput = document.getElementById('hidden-input');

    // 1. Quản lý Camera (Trước & Sau)
    async function startCamera(facing) {
        if (html5QrCode) {
            await html5QrCode.stop();
        }
        html5QrCode = new Html5Qrcode("reader");
        const config = { 
            fps: 20, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0 
        };
        
        html5QrCode.start({ facingMode: facing }, config, (decodedText) => {
            if (!isProcessing) handleData(decodedText);
        }).catch(err => {
            alert("Lỗi camera: Hãy chắc chắn bạn đang dùng link HTTPS và đã cấp quyền truy cập!");
        });
    }

    function stopCamera() { if(html5QrCode) html5QrCode.stop(); }

    // 2. Quản lý Máy quét cầm tay
    document.addEventListener('click', () => hInput.focus());
    hInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if(!isProcessing) handleData(hInput.value);
            hInput.value = '';
        }
    });

    // 3. Xử lý dữ liệu
    async function handleData(id) {
        isProcessing = true;
        document.getElementById('loading').style.display = 'flex';
        
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ id: id })
            });
            
            showToast("Đã ghi nhận mã: " + id, "var(--blue)");
            setTimeout(loadLogs, 1000); // Đợi 1s rồi tải lại bảng

        } catch (e) {
            showToast("Lỗi máy chủ!", "var(--red)");
        }

        // Chống quét trùng trong 3 giây
        setTimeout(() => {
            isProcessing = false;
            document.getElementById('loading').style.display = 'none';
        }, 3000);
    }

    // 4. Đồng bộ hóa & Reset ngày mới
    async function loadLogs() {
        const today = new Date().toLocaleDateString('vi-VN');
        document.getElementById('today-txt').innerText = today;

        // Reset App nếu sang ngày mới
        if (today !== currentDay) {
            currentDay = today;
            document.getElementById('log-table').innerHTML = '';
            document.getElementById('active-num').innerText = '0';
        }

        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            document.getElementById('active-num').innerText = data.activeCount;
            const tbody = document.getElementById('log-table');
            
            if (data.allData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:50px; color:#999;">Chưa có ai chấm công hôm nay</td></tr>`;
                return;
            }

            tbody.innerHTML = data.allData.map(row => `
                <tr style="animation: fadeInUp 0.4s">
                    <td><strong>${row.name}</strong><br><small style="color:#999">${row.id}</small></td>
                    <td>${row.dept}</td>
                    <td><span class="badge badge-in">${row.timeIn.split(' ')[0]}</span></td>
                    <td><span class="badge badge-out">${row.timeOut ? row.timeOut.split(' ')[0] : '---'}</span></td>
                    <td style="text-align:center; font-weight:bold; color:var(--green)">
                        ${row.totalMins || '...'}
                    </td>
                </tr>
            `).join('');
        } catch (e) { console.log("Đang đồng bộ..."); }
    }

    function showToast(msg, color) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.background = color; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // Tiện ích bổ sung
    document.getElementById('logo-img').onclick = () => document.getElementById('change-logo').click();
    document.getElementById('change-logo').onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => document.getElementById('logo-img').src = ev.target.result;
        r.readAsDataURL(e.target.files[0]);
    };

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleString('vi-VN');
    }, 1000);

    // Tự động làm mới mỗi 5 giây
    setInterval(loadLogs, 5000);
    window.onload = loadLogs;

</script>
</body>
</html>
