<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co.opmart Đà Nẵng - Quản Lý Nhân Viên</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --coop-blue: #005691;
            --coop-red: #ed1c24;
            --success: #27ae60;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            color: #1e293b;
        }

        /* Header */
        header {
            background: white;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--coop-red);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        #logo-img { height: 60px; cursor: pointer; border-radius: 10px; border: 1px solid #e2e8f0; padding: 4px; }
        .brand-info h1 { color: var(--coop-blue); margin: 0; font-size: 1.2rem; text-transform: uppercase; font-weight: 800; }
        .brand-info p { margin: 0; color: var(--coop-red); font-size: 0.8rem; font-weight: bold; }

        /* Dashboard */
        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 25px;
            padding: 25px 5%;
            max-width: 1600px;
            margin: auto;
        }

        /* Cột quét */
        .card-scanner {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            height: fit-content;
        }

        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #f1f5f9;
            background: #000;
            min-height: 300px; /* Giữ khung khi camera chưa load */
        }

        .btn-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-blue { background: var(--coop-blue); color: white; }
        .btn-red { background: var(--coop-red); color: white; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Cột dữ liệu */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stat-box {
            background: var(--coop-blue);
            color: white;
            padding: 22px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .stat-box.red { background: var(--coop-red); }
        .stat-box i { font-size: 2.5rem; opacity: 0.6; }
        .stat-val { font-size: 2.2rem; font-weight: 800; }

        .data-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 18px; color: var(--coop-blue); font-size: 0.8rem; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 18px; border-bottom: 1px solid #f8fafc; font-size: 0.95rem; }

        .badge { padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; }
        .badge-in { background: #dcfce7; color: #166534; }
        .badge-out { background: #fee2e2; color: #991b1b; }

        /* Overlay khi chờ 3 giây */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 15px;
        }

        /* Thông báo */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 18px 35px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: bounceIn 0.4s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        #hidden-input { position: fixed; top: -100px; opacity: 0; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <input type="file" id="logo-chooser" hidden accept="image/*">
        <img src="https://media.loveitopcdn.com/3807/logo-coopmart-compressed.jpg" title="Nhấn để đổi Logo">
        <div class="brand-info">
            <h1>Co.opmart Đà Nẵng</h1>
            <p><i class="fa-solid fa-bolt"></i> HR SYSTEM - CHẾ ĐỘ THỜI GIAN THỰC</p>
        </div>
    </div>
    <div id="clock" style="font-weight: 900; color: var(--coop-blue); font-size: 1.2rem;"></div>
</header>

<div class="main-grid">
    <div class="left-col">
        <div class="card-scanner">
            <h3 style="margin-top: 0; color: var(--coop-blue); letter-spacing: 1px;">QUÉT MÃ QR</h3>
            <div style="position: relative;">
                <div id="reader"></div>
                <div id="loading-overlay">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--coop-blue);"></i>
                    <p style="font-weight: bold; color: var(--coop-blue); margin-top: 15px;">Đang ghi nhận (3s)...</p>
                </div>
            </div>
            <div class="btn-controls">
                <button class="btn btn-blue" onclick="startCam('environment')"><i class="fa-solid fa-camera"></i> CAM SAU</button>
                <button class="btn btn-blue" onclick="startCam('user')"><i class="fa-solid fa-id-card"></i> CAM TRƯỚC</button>
                <button class="btn btn-red" style="grid-column: span 2;" onclick="stopCam()"><i class="fa-solid fa-power-off"></i> TẮT CAMERA</button>
            </div>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 20px;">Máy quét USB/Bluetooth tự động nhận diện</p>
        </div>
    </div>

    <div class="right-col">
        <div class="stats">
            <div class="stat-box">
                <i class="fa-solid fa-user-clock"></i>
                <div>
                    <span class="stat-val" id="active-count">0</span>
                    <span style="font-size: 0.8rem; font-weight: bold; text-transform: uppercase;">Nhân viên trong ca</span>
                </div>
            </div>
            <div class="stat-box red">
                <i class="fa-solid fa-calendar-check"></i>
                <div>
                    <span class="stat-val" id="current-day">--/--</span>
                    <span style="font-size: 0.8rem; font-weight: bold; text-transform: uppercase;">Ngày hiện tại</span>
                </div>
            </div>
        </div>

        <div class="data-card">
            <table>
                <thead>
                    <tr>
                        <th>Họ và Tên</th>
                        <th>Bộ Phận</th>
                        <th>Giờ Vào</th>
                        <th>Giờ Ra</th>
                        <th style="text-align: center;">Tổng (P)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align: center; padding: 80px; color: #cbd5e1;">Chưa có dữ liệu hôm nay...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<input type="text" id="hidden-input" autofocus>
<div id="toast"></div>

<script>
    // --- CẤU HÌNH ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwF3MiGBVWlvAprhv3NDi9Rn0gZJyFZ-ycfB5h2oNMf9h69MqsjnxSUXz9L1nV72UtbQg/exec";
    
    let html5QrCode;
    let isProcessing = false;
    let cachedDate = new Date().toLocaleDateString('vi-VN');
    const hInput = document.getElementById('hidden-input');

    // 1. Logic Camera (Ép trình duyệt nhận diện)
    async function startCam(mode) {
        if (html5QrCode) {
            await html5QrCode.stop();
        }
        
        // Kiểm tra quyền Camera trước khi bắt đầu
        html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 20, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0 
        };

        html5QrCode.start({ facingMode: mode }, config, 
            (text) => { if (!isProcessing) handleData(text); },
            (msg) => { /* Quét liên tục */ }
        ).catch(err => {
            console.error(err);
            alert("LỖI CAMERA: Anh hãy chắc chắn đang dùng link HTTPS hoặc đã nhấn 'Cho phép' truy cập camera.");
        });
    }

    function stopCam() { if(html5QrCode) html5QrCode.stop(); }

    // 2. Logic Máy quét cầm tay
    document.addEventListener('click', () => hInput.focus());
    hInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if(!isProcessing) handleData(hInput.value);
            hInput.value = '';
        }
    });

    // 3. Xử lý gửi dữ liệu
    async function handleData(id) {
        isProcessing = true;
        document.getElementById('loading-overlay').style.display = 'flex';
        
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ id: id })
            });
            
            showNotify("Đã nhận tín hiệu: " + id, "var(--coop-blue)");
            setTimeout(refreshUI, 1000); // Đợi 1s để Sheet cập nhật rồi tải lại

        } catch (e) {
            showNotify("Lỗi kết nối Server!", "var(--coop-red)");
        }

        // Khóa quét 3 giây
        setTimeout(() => {
            isProcessing = false;
            document.getElementById('loading-overlay').style.display = 'none';
        }, 3000);
    }

    // 4. Đồng bộ & Reset ngày mới
    async function refreshUI() {
        const today = new Date().toLocaleDateString('vi-VN');
        document.getElementById('current-day').innerText = today;

        // Reset App nếu qua 12h đêm
        if (today !== cachedDate) {
            cachedDate = today;
            document.getElementById('table-body').innerHTML = ''; 
            document.getElementById('active-count').innerText = '0';
        }

        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            document.getElementById('active-count').innerText = data.activeCount;
            const tbody = document.getElementById('table-body');
            
            if (data.allData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 80px; color: #cbd5e1;">Hôm nay chưa có dữ liệu</td></tr>`;
                return;
            }

            tbody.innerHTML = data.allData.map(row => `
                <tr style="animation: bounceIn 0.3s">
                    <td><strong>${row.name}</strong><br><small style="color:#94a3b8">${row.id}</small></td>
                    <td><span style="font-size: 0.8rem;">${row.dept}</span></td>
                    <td><span class="badge badge-in">${row.timeIn.split(' ')[0]}</span></td>
                    <td><span class="badge badge-out">${row.timeOut ? row.timeOut.split(' ')[0] : '--:--'}</span></td>
                    <td style="text-align: center; font-weight: 800; color: var(--success)">
                        ${row.totalMins || '...'}
                    </td>
                </tr>
            `).join('');
        } catch (e) { /* Đồng bộ ngầm */ }
    }

    function showNotify(msg, color) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.background = color; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // Tiện ích Header
    document.getElementById('logo-img').onclick = () => document.getElementById('logo-chooser').click();
    document.getElementById('logo-chooser').onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => document.getElementById('logo-img').src = ev.target.result;
        r.readAsDataURL(e.target.files[0]);
    };

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN');
    }, 1000);

    // Tự động cập nhật sau mỗi 5s
    setInterval(refreshUI, 5000);
    window.onload = refreshUI;

</script>
</body>
</html>
